name: Build BANG IPTV v4 Windows beta

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v4-beta.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-v4.txt pyinstaller
      - name: Check source and run regression tests
        shell: pwsh
        run: |
          python -m py_compile bang_iptv_v4.py
          python -m unittest discover -s tests -p "test_v4_regression.py" -v
      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name BANG_IPTV_v4 --hidden-import=vlc --hidden-import=requests --hidden-import=bs4 --hidden-import=PIL --hidden-import=PIL.ImageTk bang_iptv_v4.py
          if (-not (Test-Path dist/BANG_IPTV_v4.exe)) { throw "BANG IPTV v4 executable missing." }
      - name: Save Windows executable as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: BANG-IPTV-v4-Windows
          path: dist/BANG_IPTV_v4.exe
          retention-days: 30
          if-no-files-found: error
      - name: Publish new beta tag without overwriting old versions
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.0-beta.1
          target_commitish: ${{ github.sha }}
          name: BANG IPTV v4.0 Beta 1 — Restored full interface
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: dist/BANG_IPTV_v4.exe
          body: |
            ## BANG IPTV v4 beta
            Richer Windows desktop player based on the supplied v4 interface, with improvements for startup, scrolling, persistent settings and unavailable-link handling.

            - Full channel sidebar and vertical scrollbar restored
            - Automatically load the last saved playlist on opening (default: Bangladesh Free TV)
            - Channel logos, favourites, history, search, sorting, fullscreen and playback controls
            - Hide confirmed dead channels by default; periodic checks and source refresh retained
            - Distinguish temporary network/access errors from explicitly unavailable streams
            - Store preferences under Windows LocalAppData instead of the temporary EXE extraction directory
            - Optional locked link visibility through Ctrl+L; no code is advertised
            - Startup does not attempt to install pip packages at runtime

            ## Notes
            VLC Media Player must be installed on Windows with a matching CPU architecture.
            Stream availability varies and link repair is best-effort; successful HTTP checks do not guarantee playback.
            Windows compilation and automated regression tests do not substitute for manual playback testing.
            The August 2026 stable release and v3 beta releases are preserved untouched.
