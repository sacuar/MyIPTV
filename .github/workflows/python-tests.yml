name: Playlist tools tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python files
        run: python -m compileall -q gui2.py m3u_export.py playlist_service.py scripts/clean_playlists.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
