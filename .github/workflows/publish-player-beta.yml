name: Publish BANG IPTV Pro v3 beta 3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-player-beta.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-publish:
    runs-on: windows-latest
    steps:
      - name: Check out updated player source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile player and run core tests
        shell: pwsh
        run: |
          python -m compileall -q player_core.py health_engine.py m3u_export.py bang_iptv_player.py
          python -m unittest discover -s tests -v

      - name: Build standalone Python executable
        shell: pwsh
        run: |
          python -m pip install -r requirements-player.txt pyinstaller
          pyinstaller --noconfirm --clean --onefile --windowed --name BANG_IPTV_Pro --hidden-import vlc bang_iptv_player.py
          if (-not (Test-Path dist/BANG_IPTV_Pro.exe)) {
            throw "The Windows executable was not created."
          }

      - name: Publish beta release without overwriting existing stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0-beta.3
          target_commitish: ${{ github.sha }}
          name: BANG IPTV Pro v3.0 Beta 3 — Community and channel controls
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: dist/BANG_IPTV_Pro.exe
          body: |
            ## New Windows player — beta build
            This is the third beta of the new BANG IPTV Pro player. Both earlier betas and the original August 2026 stable release remain unchanged.
            The original August 2026 release remains available and unchanged.

            ### Included
            - Embedded VLC video playback (requires VLC Media Player installed on Windows)
            - Free M3U source presets for Bangladesh, UK, Germany and international channels
            - Search, favourites, group filtering, play/pause/stop, volume and fullscreen
            - Asynchronous playlist loading and duplicate URL removal
            - Automatic playlist refresh every 30 minutes while the app is running (optional)
            - Background stream checks in bounded batches, with confirmation of HTTP 404/410 before hiding
            - Hide stopped links in the channel list, Show stopped toggle, and live status badges
            - Check now and Export verified working M3U options
            - Previous/next channel buttons (Ctrl+Left/Ctrl+Right), manual reconnect (Ctrl+R)
            - In-app Help & Contribute links to GitHub issues, code contributions and optional support

            ### Important
            - This is a replacement implementation, not an upgrade applied to the original EXE.
            - EPG display, channel logos in the channel list, and protected-link visibility are not implemented in this new player.
            - A successful HTTP response does not prove video decodes; HLS manifests are inspected and VLC playback errors hide failed channels.
            - Repeated missing (404/410) links are hidden, not deleted permanently. Uncertain/time-out/geoblocked links are not silently removed.
            - For very large playlists, checks run in batches and full revalidation takes longer than 5 minutes.
            - Windows playback has not been manually validated; please report problems using GitHub Issues.
            - Only stream content that you have permission to access.

            Download BANG_IPTV_Pro.exe under Assets below.
