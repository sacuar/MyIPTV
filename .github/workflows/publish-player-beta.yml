name: Publish BANG IPTV beta 3

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-player-beta.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-publish:
    runs-on: windows-latest
    steps:
      - name: Check out updated player source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile player and run core tests
        shell: pwsh
        run: |
          python -m compileall -q player_core.py health_engine.py m3u_export.py link_access.py channel_recovery.py bang_iptv_player.py
          python -m unittest discover -s tests -v

      - name: Build standalone Python executable
        shell: pwsh
        run: |
          python -m pip install -r requirements-player.txt pyinstaller
          pyinstaller --noconfirm --clean --onefile --windowed --name BANG_IPTV --hidden-import vlc bang_iptv_player.py
          if (-not (Test-Path dist/BANG_IPTV.exe)) {
            throw "The Windows executable was not created."
          }

      - name: Publish beta release without overwriting existing stable release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0-beta.3
          target_commitish: ${{ github.sha }}
          name: BANG IPTV v3.0 Beta 3 — Private links and recovery
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: dist/BANG_IPTV.exe
          body: |
            ## BANG IPTV v3 Beta 3 — Stream privacy and recovery
            This beta is a separate release. The original August 2026 stable version and Beta 1/Beta 2 stay available unchanged.

            ### Improvements
            - Stream URLs and playlist source are hidden by default; Ctrl+L opens the private access prompt.
            - Links automatically relock after five minutes; no unlock code is published here.
            - Confirmed offline streams remain hidden from the channel list, but are recoverable.
            - Automatically look for exact channel-ID/name matches from an established free IPTV source, verify the candidate endpoint, and reuse a suitable alternative when available.
            - Save found replacements locally and preserve them across playlist refreshes, maintaining favourite channels.
            - Prioritise unchecked channels on large playlists so checks reach the whole list rather than continuously rechecking its beginning.
            - Manual Find alternative and Show stopped options remain available.

            ### Limitations
            - This private-link control is NOT encryption or robust access control. Public source and binaries can be examined.
            - Online HTTP/HLS checks cannot guarantee video decode, rights or geographic availability.
            - No alternative can be promised for every broadcaster. The player does not bypass DRM or subscriptions.
            - Windows playback has not yet been manually verified. Please report bugs through GitHub Issues.
            - Install VLC Media Player to enable video playback.

            The executable is now named BANG_IPTV.exe. Historic releases retain their earlier filenames.
