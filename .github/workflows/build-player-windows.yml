name: Build BANG IPTV Pro Windows player

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check source syntax
        run: python -m compileall -q player_core.py health_engine.py m3u_export.py bang_iptv_player.py

      - name: Run player core tests
        run: python -m unittest discover -s tests -v

      - name: Install packaging dependencies
        run: python -m pip install -r requirements-player.txt pyinstaller

      - name: Build portable Windows EXE
        run: pyinstaller --noconfirm --clean --onefile --windowed --name BANG_IPTV_Pro --hidden-import vlc bang_iptv_player.py

      - name: Upload player executable
        uses: actions/upload-artifact@v4
        with:
          name: BANG-IPTV-Pro-Windows
          path: dist/BANG_IPTV_Pro.exe
          retention-days: 30
          if-no-files-found: error
