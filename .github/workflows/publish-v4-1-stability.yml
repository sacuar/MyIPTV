name: Publish BANG IPTV v4.1 stability beta

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-v4-1-stability.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -r requirements-v4.txt pyinstaller
      - name: Compile and run full regression tests
        shell: pwsh
        run: |
          python -m py_compile bang_iptv_v4.py stream_reliability.py
          python -m unittest discover -s tests -v
      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed --name BANG_IPTV_v4_1_stability --hidden-import vlc --hidden-import requests --hidden-import bs4 --hidden-import PIL --hidden-import PIL.ImageTk bang_iptv_v4.py
          if (-not (Test-Path dist/BANG_IPTV_v4_1_stability.exe)) { throw "Executable not produced" }
      - name: Save preview asset
        uses: actions/upload-artifact@v4
        with:
          name: BANG-IPTV-v4.1-stability-beta
          path: dist/BANG_IPTV_v4_1_stability.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish separate prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.1.0-beta.2
          target_commitish: ${{ github.sha }}
          name: BANG IPTV v4.1 Beta 2 — Stability fixes
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            dist/BANG_IPTV_v4_1_stability.exe
            LICENSE
            LICENSE-LEGACY-UNLICENSE.txt
          body: |
            ## BANG IPTV v4.1 Beta 2
            Focused stability patch on top of v4.1 Beta 1. Existing controls, sidebar scrollbar, VLC playback, and user preferences are preserved.

            - A partial background playlist refresh now **keeps the existing channel list** instead of deleting healthy channels from sources that temporarily failed.
            - Remote M3U downloads are capped at 8 MiB and always closed.
            - Saved settings and repair override files are validated before loading.
            - Manual stream rechecks distinguish confirmed missing links from timeouts and access restrictions.
            - Existing beta and original stable EXEs remain available.

            **Licensing:** Rights notice for new original additions: see LICENSE. The historic Unlicense permissions are preserved in LICENSE-LEGACY-UNLICENSE.txt; previously granted freedoms cannot be revoked.
            **Testing:** Automated Python regression tests and Windows EXE packaging passed; real live-stream playback on individual systems still needs manual validation. No guarantee of uninterrupted playback or replacement streams.
